networks:
  ci_network:
    driver: bridge

volumes:
  jenkins_home:
    external: true
  jenkins_workspace:
    external: true
  output:

services:
  jenkins:
    build: ./jenkins
    container_name: jenkins_server
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins_workspace:/var/jenkins_home/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci_network
    restart: unless-stopped

  selenium-firefox:
    build: ./selenium_runner
    container_name: selenium_runner
    volumes:
      - jenkins_workspace:/app
      - ./selenium_runner/certificado.p12:/home/seluser/certificado.p12:ro
      - output:/home/seluser/output
    networks:
      - ci_network
    shm_size: "2gb"
    restart: unless-stopped

  python-runner:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - jenkins_workspace:/app
      - ./01-Email_Listener/.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
